<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Conferência de Cartão — Check-in | DOMINGO</title>
<style>
:root{
    --laranja: #48db7e;
    --laranja-escuro: #166534;
    --laranja-claro: #fff3e0;
    --preto: #1a1a1a;
    --vermelho: #dc2626;
    --amarelo: #facc15;
    --verde: #16a34a;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{
    margin:0; height:100%;
    font-family: Arial, sans-serif;
    background: var(--laranja);
    color:#000;
    overscroll-behavior:none;
}

/* ---------- TELA DE SENHA ---------- */
#tela-login{
    position:fixed; inset:0;
    background: var(--laranja);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:16px; padding:24px; z-index:100;
}
#tela-login img{ width:70px; margin-bottom:4px; }
#tela-login h1{ font-size:18px; text-align:center; margin:0; color:var(--preto); }
#tela-login form{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:280px; }
#tela-login input{
    padding:14px; font-size:18px; border:2px solid var(--laranja-escuro);
    border-radius:8px; text-align:center; letter-spacing:2px;
}
#tela-login button{
    padding:14px; font-size:16px; font-weight:bold; background:var(--laranja-escuro);
    color:#fff; border:none; border-radius:8px; cursor:pointer;
}
#erro-login{ color:#7f1d1d; font-size:13px; font-weight:bold; min-height:16px; }

/* ---------- APP ---------- */
#app{ display:none; height:100%; flex-direction:column; }
body.logado #app{ display:flex; }
body.logado #tela-login{ display:none; }

#header{
    flex-shrink:0; background:var(--laranja-escuro); color:#fff;
    padding:10px 14px; display:flex; align-items:center; justify-content:space-between;
    gap:10px;
}
#header .titulo{ font-size:14px; font-weight:bold; line-height:1.2; }
#header .titulo small{ display:block; font-weight:normal; opacity:0.85; font-size:11px; }
#btn-sair{
    background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.4);
    color:#fff; border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer;
}

#abas{
    flex-shrink:0; display:flex; background:#fff3e0; overflow-x:auto;
    border-bottom:2px solid var(--laranja-escuro);
}
.aba-btn{
    flex:1 0 auto; min-width:110px; text-align:center; padding:12px 10px;
    font-size:13px; font-weight:bold; background:none; border:none; cursor:pointer;
    color:var(--laranja-escuro); border-bottom:3px solid transparent; white-space:nowrap;
}
.aba-btn.ativa{ border-bottom:3px solid var(--laranja-escuro); background:#ffe1b8; }

#barra-busca{
    flex-shrink:0; padding:10px; background:#fff; border-bottom:1px solid #eee;
    display:flex; gap:8px;
}
#busca{
    flex:1; padding:12px; font-size:15px; border:2px solid #ddd; border-radius:8px;
}
#busca:focus{ border-color:var(--laranja-escuro); outline:none; }
#status-conexao{ font-size:10px; text-align:center; padding:2px; color:#888; background:#fff; }
#status-conexao.erro{ color:#b91c1c; font-weight:bold; }

#lista{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px; }
.item{
    background:#fff; border:1px solid #eee; border-left:6px solid #ccc;
    border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
}
.item.st-npresente{ border-left-color:var(--vermelho); }
.item.st-aguardando{ border-left-color:var(--amarelo); }
.item.st-concluido{ border-left-color:var(--verde); }
.item-info{ min-width:0; }
.item-nome{ font-weight:bold; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item-sub{ font-size:12px; color:#666; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item-badge{
    font-size:10px; font-weight:bold; padding:4px 8px; border-radius:12px; flex-shrink:0;
    color:#fff; white-space:nowrap;
}
.badge-npresente{ background:var(--vermelho); }
.badge-aguardando{ background:var(--amarelo); color:#000; }
.badge-concluido{ background:var(--verde); }

#vazio{ text-align:center; color:#a15c00; padding:40px 20px; font-size:14px; }

/* ---------- LEGENDA ---------- */
#legenda{
    flex-shrink:0; display:flex; justify-content:center; gap:14px; padding:6px;
    background:#fff3e0; font-size:10px; font-weight:bold; text-transform:uppercase;
    border-top:1px solid rgba(194,65,12,0.2);
}
.leg-item{ display:flex; align-items:center; gap:4px; }
.leg-ponto{ width:10px; height:10px; border-radius:50%; }

/* ---------- MODAL DE DETALHE ---------- */
#overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none;
    align-items:flex-end; justify-content:center; z-index:50;
}
#overlay.aberto{ display:flex; }
#modal{
    background:#fff; width:100%; max-width:480px; border-radius:16px 16px 0 0;
    padding:20px; max-height:88vh; overflow-y:auto;
}
#modal h2{ margin:0 0 2px 0; font-size:18px; }
#modal .sub{ color:#666; font-size:13px; margin-bottom:14px; }
.campo{ display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px dashed #eee; }
.campo b{ color:#555; }
.botoes-status{ display:flex; gap:8px; margin-top:16px; }
.botoes-status button{
    flex:1; padding:14px 4px; border:none; border-radius:8px; font-weight:bold;
    font-size:12px; color:#fff; cursor:pointer; text-transform:uppercase;
}
.bt-npresente{ background:var(--vermelho); }
.bt-aguardando{ background:var(--amarelo); color:#000; }
.bt-concluido{ background:var(--verde); }
.botoes-status button.selecionado{ outline:3px solid var(--preto); outline-offset:2px; }
#fechar-modal{
    display:block; width:100%; margin-top:14px; padding:12px; background:#eee;
    border:none; border-radius:8px; font-weight:bold; cursor:pointer;
}
#lista-integrantes{ margin-top:14px; border-top:2px solid #f0f0f0; padding-top:10px; }
.integrante-row{ padding:8px 0; border-bottom:1px solid #f5f5f5; font-size:12px; }
.integrante-row .nome{ font-weight:bold; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mini-botoes{ display:flex; gap:4px; flex-shrink:0; }
.mini-botoes button{ width:26px; height:26px; border-radius:50%; border:2px solid #fff; cursor:pointer; }
.mini-botoes button.ativo{ border-color:var(--preto); }

/* ---------- EDIÇÃO/EXCLUSÃO DE INTEGRANTE (aba Grupo) ---------- */
.integrante-view{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.integrante-view .item-info{ min-width:0; }
.mini-acoes{ display:flex; gap:4px; flex-shrink:0; }
.mini-acoes button{
    border:1px solid #eee; background:#f7f7f7; border-radius:6px;
    padding:5px 8px; font-size:13px; cursor:pointer; line-height:1;
}
.bt-excluir-integrante{ background:#fee2e2; border-color:#fecaca; }
.integrante-edit{ display:none; flex-direction:column; gap:6px; padding-top:8px; }
.integrante-edit input{
    padding:9px; font-size:12px; border:1px solid #ddd; border-radius:6px; width:100%;
}
.integrante-edit input:focus{ border-color:var(--laranja-escuro); outline:none; }
.edit-botoes{ display:flex; gap:6px; margin-top:2px; }
.edit-botoes button{
    flex:1; padding:9px; border:none; border-radius:6px; font-size:12px;
    font-weight:bold; cursor:pointer;
}
.bt-salvar-integrante{ background:var(--verde); color:#fff; }
.bt-cancelar-integrante{ background:#eee; color:#333; }

/* ---------- EDIÇÃO/EXCLUSÃO DE ITEM INTEIRO (demais abas) ---------- */
#corpo-edit{ margin-top:8px; }
.campo-edit{ display:flex; flex-direction:column; gap:4px; margin-bottom:10px; font-size:12px; }
.campo-edit label{ font-weight:bold; color:#555; font-size:11px; text-transform:uppercase; letter-spacing:.3px; }
.campo-edit input{ padding:9px; border:1px solid #ddd; border-radius:6px; font-size:13px; width:100%; }
.campo-edit input:focus{ border-color:var(--laranja-escuro); outline:none; }
.acoes-item{ display:flex; gap:8px; margin-top:12px; }
.acoes-item button{
    flex:1; padding:11px; border-radius:8px; border:1px solid #eee;
    background:#f7f7f7; font-size:12px; font-weight:bold; cursor:pointer;
}
.acoes-item .bt-excluir-item-btn{ background:#fee2e2; border-color:#fecaca; color:#7f1d1d; }

#toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(100px);
    background:var(--preto); color:#fff; padding:12px 20px; border-radius:24px;
    font-size:13px; font-weight:bold; z-index:200; transition:transform .25s ease; text-align:center;
}
#toast.mostrar{ transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ===================== TELA DE SENHA ===================== -->
<div id="tela-login">
    <img
    src="https://raw.githubusercontent.com/NossoEventoRS/Imagens/refs/heads/main/Logo.png" style="width:20%; height:auto; object-fit:contain;">
    <h1>Conferência de Cartão<br><small style="font-weight:normal;">Acesso restrito à equipe</small></h1>
    <form id="form-login">
        <input type="password" id="input-senha" placeholder="Senha de acesso" inputmode="numeric" autocomplete="off">
        <div id="erro-login"></div>
        <button type="submit">Entrar</button>
    </form>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
    <div id="header">
        <div class="titulo">Conferência de Cartão | DOMINGO 23/08/2026
            <small>10ª FETARC | CTG Amaranto Pererita - 1ª RT - Alvorada / RS</small>
        </div>
        <button id="btn-sair">Sair</button>
    </div>

    <div id="abas"></div>

    <div id="barra-busca">
        <input id="busca" type="text" placeholder="Buscar por cartão, nome ou entidade...">
    </div>
    <div id="status-conexao">Carregando dados...</div>

    <div id="lista"></div>

    <div id="legenda">
        <div class="leg-item"><div class="leg-ponto" style="background:var(--vermelho)"></div>Não presente</div>
        <div class="leg-item"><div class="leg-ponto" style="background:var(--amarelo)"></div>Check-in feito</div>
        <div class="leg-item"><div class="leg-ponto" style="background:var(--verde)"></div>Concluído</div>
    </div>
</div>

<!-- ===================== MODAL ===================== -->
<div id="overlay">
    <div id="modal"></div>
</div>

<div id="toast"></div>

<script>
/* =========================================================================
   CONFIGURAÇÃO — ajuste aqui para o seu evento
   ========================================================================= */

// Mesma URL do Apps Script usada no painel.html (precisa aceitar POST também,
// veja o código .gs fornecido junto com este arquivo).
const URL_API = "https://script.google.com/macros/s/AKfycbwL6-o_jAqK9gIlp-uuzcaIwkOYnxuZzCe3ERWdXcN6dpLNkVrZMb5AZGdvPL9eKFdpnQ/exec";

// Senha única da equipe. Troque para a senha real do evento.
const SENHA_ACESSO = "amaranto2026";

// Abas do painel: "Rótulo mostrado" -> "Nome exato da aba na planilha Google".
const MODALIDADES = {
    "Intérprete": "Intérprete",
    "Grupo": "Grupo"
};

/* ========================================================================= */

let dadosGlobais = {};
let abaAtiva = Object.keys(MODALIDADES)[0];
let itemAberto = null; // { linha do item clicado }

// ---------- LOGIN ----------
if (sessionStorage.getItem("checkin_auth") === "ok") {
    document.body.classList.add("logado");
}

document.getElementById("form-login").addEventListener("submit", function(e){
    e.preventDefault();
    const val = document.getElementById("input-senha").value;
    if (val === SENHA_ACESSO) {
        sessionStorage.setItem("checkin_auth", "ok");
        document.body.classList.add("logado");
        iniciar();
    } else {
        document.getElementById("erro-login").innerText = "Senha incorreta. Tente novamente.";
        document.getElementById("input-senha").value = "";
    }
});

document.getElementById("btn-sair").addEventListener("click", function(){
    sessionStorage.removeItem("checkin_auth");
    document.body.classList.remove("logado");
});

// ---------- UTIL ----------
function normalizar(txt){
    return String(txt || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function esc(s){
    return String(s == null ? "" : s)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function pegar(obj, nomes){
    for (const n of nomes){
        for (const k in obj){
            if (normalizar(k) === normalizar(n)) return obj[k];
        }
    }
    return "";
}

function classeStatus(status){
    const s = normalizar(status);
    if (s.includes("nao presente")) return "npresente";
    if (s.includes("concluido")) return "concluido";
    if (s === "") return "";
    return "aguardando"; // qualquer outro texto (ex: check-in realizado) cai aqui
}

function mostrarToast(msg){
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.classList.add("mostrar");
    setTimeout(()=> t.classList.remove("mostrar"), 2200);
}

// ---------- ABAS ----------
function montarAbas(){
    const cont = document.getElementById("abas");
    cont.innerHTML = "";
    Object.keys(MODALIDADES).forEach(rotulo => {
        const btn = document.createElement("button");
        btn.className = "aba-btn" + (rotulo === abaAtiva ? " ativa" : "");
        btn.innerText = rotulo;
        btn.onclick = () => { abaAtiva = rotulo; montarAbas(); renderizarLista(); };
        cont.appendChild(btn);
    });
}

// ---------- CARREGAR DADOS ----------
function carregarDados(mostrarLoading){
    const statusEl = document.getElementById("status-conexao");
    if (mostrarLoading) statusEl.innerText = "Carregando dados...";
    fetch(URL_API)
        .then(r => r.json())
        .then(resp => {
            dadosGlobais = resp;
            statusEl.classList.remove("erro");
            const agora = new Date();
            statusEl.innerText = "Atualizado às " + agora.toLocaleTimeString("pt-BR");
            renderizarLista();
        })
        .catch(err => {
            statusEl.classList.add("erro");
            statusEl.innerText = "Falha ao carregar dados. Verifique a internet.";
            console.error(err);
        });
}

// ---------- LISTA ----------
function itensDaAbaAtiva(){
    const nomeAba = MODALIDADES[abaAtiva];
    return dadosGlobais[nomeAba] || [];
}

// A aba "Grupo" já chega pré-agrupada do Apps Script: uma linha por
// entidade, com Ordem, Categoria, Entidade, RT, Status, Integrantes e
// _row (a linha da planilha que guarda o Status real daquele grupo).
function ehGrupo(){
    return normalizar(abaAtiva).includes("grupo");
}

// Junta todos os campos de texto relevantes do item num único texto
// normalizado, pra busca funcionar em qualquer formato de aba.
function textoBuscaItem(l){
    return normalizar([
        pegar(l, ["Nomes","Nome","Concorrente"]),
        pegar(l, ["Entidade"]),
        pegar(l, ["Cartão","Cartao"])
    ].join(" "));
}

function renderizarLista(){
    const lista = document.getElementById("lista");
    const termo = normalizar(document.getElementById("busca").value);
    let itens = itensDaAbaAtiva();

    if (termo){
        itens = itens.filter(l => textoBuscaItem(l).includes(termo));
    }

    lista.innerHTML = "";
    if (itens.length === 0){
        lista.innerHTML = `<div id="vazio">${ehGrupo() ? "Nenhum grupo encontrado." : "Nenhum concorrente encontrado."}</div>`;
        return;
    }

    itens.forEach(l => {
        const status = pegar(l, ["Status"]);
        const cls = classeStatus(status);
        const ordem = pegar(l, ["Ordem"]);
        const entidade = pegar(l, ["Entidade"]);
        const categoria = pegar(l, ["Categoria"]);
        let nomePrincipal;
        if (ehGrupo()) nomePrincipal = entidade;
        else nomePrincipal = pegar(l, ["Nomes","Nome","Concorrente"]);
        const infoBase = ehGrupo() ? `${pegar(l,["Integrantes"])} integrantes` : entidade;
        const subtitulo = categoria ? `${categoria} · ${infoBase}` : infoBase;

        const div = document.createElement("div");
        div.className = "item st-" + cls;
        div.dataset.row = l._row;
        div.innerHTML = `
            <div class="item-info">
                <div class="item-nome">${ordem ? ordem + " · " : ""}${nomePrincipal}</div>
                <div class="item-sub">${subtitulo}</div>
            </div>
            <div class="item-badge badge-${cls || 'aguardando'}">${status || "—"}</div>
        `;
        div.onclick = () => abrirDetalhe(l);
        lista.appendChild(div);
    });
}

// Atualiza só o card de UM item na lista (sem redesenhar a lista inteira).
// Muito mais rápido que renderizarLista() em abas com muitas linhas (ex: Intérprete).
// Se o item não estiver na tela no momento (ex: foi filtrado pela busca),
// cai de volta pro renderizarLista() completo.
function atualizarItemVisual(item){
    const el = document.querySelector('.item[data-row="' + item._row + '"]');
    if (!el){ renderizarLista(); return; }
    const status = pegar(item, ["Status"]);
    const cls = classeStatus(status);
    el.className = "item st-" + cls;
    const badge = el.querySelector(".item-badge");
    badge.className = "item-badge badge-" + (cls || "aguardando");
    badge.textContent = status || "—";
}

document.getElementById("busca").addEventListener("input", renderizarLista);

// ---------- MODAL DE DETALHE ----------
function listaIntegrantesHtml(item){
    const membros = item.IntegrantesLista || [];
    if (membros.length === 0) return "";
    return membros.map(m => `
        <div class="integrante-row" data-row="${m._row}">
            <div class="integrante-view">
                <div class="item-info">
                    <div class="nome">${esc(m.Nome)}</div>
                    <div style="font-size:11px; color:#777;">
                        ${m.Cartao ? "Cartão " + esc(m.Cartao) : ""}${m.Nascimento ? " · " + esc(m.Nascimento) : ""}${m.Municipio ? " · " + esc(m.Municipio) : ""}
                    </div>
                </div>
                <div class="mini-acoes">
                    <button class="bt-editar-integrante" type="button" title="Editar">✏️</button>
                    <button class="bt-excluir-integrante" type="button" title="Excluir">🗑️</button>
                </div>
            </div>
            <div class="integrante-edit">
                <input class="in-nome" value="${esc(m.Nome)}" placeholder="Nome">
                <input class="in-cartao" value="${esc(m.Cartao)}" placeholder="Cartão">
                <input class="in-nascimento" value="${esc(m.Nascimento)}" placeholder="Nascimento (dd/mm/aaaa)">
                <input class="in-municipio" value="${esc(m.Municipio)}" placeholder="Município">
                <div class="edit-botoes">
                    <button class="bt-salvar-integrante" type="button">Salvar</button>
                    <button class="bt-cancelar-integrante" type="button">Cancelar</button>
                </div>
            </div>
        </div>
    `).join("");
}

// Liga os botões de editar/excluir/salvar/cancelar de cada integrante
// listado no modal de detalhe (só existe quando a aba ativa é "Grupo").
function ativarAcoesIntegrantes(){
    document.querySelectorAll('#lista-integrantes .integrante-row').forEach(linha => {
        const rowNum = linha.dataset.row;
        const view = linha.querySelector('.integrante-view');
        const edit = linha.querySelector('.integrante-edit');

        linha.querySelector('.bt-editar-integrante').onclick = () => {
            view.style.display = 'none';
            edit.style.display = 'flex';
        };
        linha.querySelector('.bt-cancelar-integrante').onclick = () => {
            edit.style.display = 'none';
            view.style.display = 'flex';
        };
        linha.querySelector('.bt-salvar-integrante').onclick = () => {
            const campos = {
                Nome: linha.querySelector('.in-nome').value.trim(),
                Cartao: linha.querySelector('.in-cartao').value.trim(),
                Nascimento: linha.querySelector('.in-nascimento').value.trim(),
                Municipio: linha.querySelector('.in-municipio').value.trim()
            };
            if (!campos.Nome){
                mostrarToast("O nome não pode ficar vazio");
                return;
            }
            salvarIntegrante(rowNum, campos);
        };
        linha.querySelector('.bt-excluir-integrante').onclick = () => {
            const nome = linha.querySelector('.in-nome').value || "este integrante";
            if (confirm(`Excluir "${nome}" deste grupo? Essa ação não pode ser desfeita.`)){
                excluirIntegranteRemoto(rowNum);
            }
        };
    });
}

function salvarIntegrante(row, campos){
    mostrarToast("Salvando...");
    fetch(URL_API, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ acao: "editarIntegrante", row: Number(row), campos })
    })
    .then(r => r.json())
    .then(resp => {
        if (resp.ok){
            mostrarToast("Integrante atualizado ✓");
            fecharModal();
            carregarDados(false);
        } else {
            mostrarToast("Erro: " + (resp.error || "não foi possível salvar"));
        }
    })
    .catch(err => {
        console.error(err);
        mostrarToast("Falha de conexão — não salvou, tente de novo");
    });
}

function excluirIntegranteRemoto(row){
    mostrarToast("Excluindo...");
    fetch(URL_API, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ acao: "excluirIntegrante", row: Number(row) })
    })
    .then(r => r.json())
    .then(resp => {
        if (resp.ok){
            mostrarToast("Integrante excluído ✓");
            fecharModal();
            carregarDados(false);
        } else {
            mostrarToast("Erro: " + (resp.error || "não foi possível excluir"));
        }
    })
    .catch(err => {
        console.error(err);
        mostrarToast("Falha de conexão — não excluiu, tente de novo");
    });
}

// Monta os inputs de edição do item inteiro (Intérprete — a aba Grupo edita
// cada integrante à parte, não o item todo).
function corpoEditHtml(item){
    return `
        <div class="campo-edit"><label>Nome</label><input id="ed-nome" value="${esc(pegar(item,["Nomes","Nome","Concorrente"]))}"></div>
        <div class="campo-edit"><label>Entidade</label><input id="ed-entidade" value="${esc(pegar(item,["Entidade"]))}"></div>
        <div class="campo-edit"><label>Cartão</label><input id="ed-cartao" value="${esc(pegar(item,["Cartão","Cartao"]))}"></div>
        <div class="campo-edit"><label>Nascimento</label><input id="ed-nascimento" value="${esc(pegar(item,["Nascimento"]))}" placeholder="dd/mm/aaaa"></div>
        <div class="campo-edit"><label>Município</label><input id="ed-municipio" value="${esc(pegar(item,["Municipio","Município"]))}"></div>
        <div class="campo-edit"><label>RT</label><input id="ed-rt" value="${esc(pegar(item,["RT"]))}"></div>
    `;
}

function abrirDetalhe(item){
    itemAberto = item;
    const nomeAba = MODALIDADES[abaAtiva];
    const status = pegar(item, ["Status"]);
    const cls = classeStatus(status);
    const grupo = ehGrupo();

    let titulo, corpo;

    if (grupo){
        titulo = pegar(item,["Entidade"]);
        corpo = `
            <div class="campo"><span>Integrantes</span><b>${pegar(item,["Integrantes"])}</b></div>
            <div class="campo"><span>RT</span><b>${pegar(item,["RT"])}</b></div>
            <div id="lista-integrantes"><div style="font-size:11px; font-weight:bold; color:#a15c00; text-transform:uppercase; margin-bottom:4px;">Integrantes</div>${listaIntegrantesHtml(item)}</div>
        `;
    } else {
        titulo = pegar(item,["Nomes","Nome","Concorrente"]);
        corpo = `
            <div class="campo"><span>Entidade</span><b>${pegar(item,["Entidade"])}</b></div>
            <div class="campo"><span>Cartão</span><b>${pegar(item,["Cartão","Cartao"])}</b></div>
            <div class="campo"><span>Nascimento</span><b>${pegar(item,["Nascimento"]) || "-"}</b></div>
            <div class="campo"><span>Município</span><b>${pegar(item,["Municipio","Município"])}</b></div>
            <div class="campo"><span>RT</span><b>${pegar(item,["RT"])}</b></div>
        `;
    }

    const modal = document.getElementById("modal");
    const corpoEdit = !grupo ? `
        <div id="corpo-edit" style="display:none;">
            ${corpoEditHtml(item)}
            <div class="edit-botoes">
                <button id="bt-salvar-item" type="button" class="bt-salvar-integrante">Salvar</button>
                <button id="bt-cancelar-item" type="button" class="bt-cancelar-integrante">Cancelar</button>
            </div>
        </div>
    ` : "";
    const acoesItem = !grupo ? `
        <div class="acoes-item">
            <button id="bt-editar-item" type="button">✏️ Editar informações</button>
            <button id="bt-excluir-item" type="button" class="bt-excluir-item-btn">🗑️ Excluir</button>
        </div>
    ` : "";

    modal.innerHTML = `
        <h2>${titulo}</h2>
        <div class="sub">${pegar(item,["Categoria"])} · Ordem ${pegar(item,["Ordem"]) || "-"}</div>
        <div id="corpo-view">${corpo}</div>
        ${corpoEdit}
        <div class="botoes-status">
            <button class="bt-npresente ${cls==='npresente'?'selecionado':''}" data-v="Não presente">Não presente</button>
            <button class="bt-aguardando ${cls==='aguardando'?'selecionado':''}" data-v="Check-in OK">Check-in</button>
        </div>
        ${acoesItem}
        <button id="fechar-modal">Fechar</button>
    `;
    modal.querySelectorAll(".botoes-status button").forEach(btn => {
        btn.onclick = () => enviarAtualizacao(nomeAba, [item._row], btn.dataset.v, item);
    });
    document.getElementById("fechar-modal").onclick = fecharModal;
    document.getElementById("overlay").classList.add("aberto");

    if (grupo) ativarAcoesIntegrantes();

    if (!grupo){
        const corpoViewEl = document.getElementById("corpo-view");
        const corpoEditEl = document.getElementById("corpo-edit");

        document.getElementById("bt-editar-item").onclick = () => {
            corpoViewEl.style.display = "none";
            corpoEditEl.style.display = "block";
        };
        document.getElementById("bt-cancelar-item").onclick = () => {
            corpoEditEl.style.display = "none";
            corpoViewEl.style.display = "block";
        };
        document.getElementById("bt-salvar-item").onclick = () => {
            const campos = {
                Nome: document.getElementById("ed-nome").value.trim(),
                Entidade: document.getElementById("ed-entidade").value.trim(),
                Cartao: document.getElementById("ed-cartao").value.trim(),
                Nascimento: document.getElementById("ed-nascimento").value.trim(),
                Municipio: document.getElementById("ed-municipio").value.trim(),
                RT: document.getElementById("ed-rt").value.trim()
            };
            if (!campos.Nome){
                mostrarToast("O nome não pode ficar vazio");
                return;
            }
            salvarItem(nomeAba, item._row, campos);
        };
        document.getElementById("bt-excluir-item").onclick = () => {
            if (confirm(`Excluir "${titulo}"? Essa ação não pode ser desfeita.`)){
                excluirItemRemoto(nomeAba, item._row);
            }
        };
    }
}

// ---------- EDITAR/EXCLUIR ITEM INTEIRO (Intérprete) ----------
function salvarItem(aba, row, campos){
    mostrarToast("Salvando...");
    fetch(URL_API, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ acao: "editarItem", aba, row: Number(row), campos })
    })
    .then(r => r.json())
    .then(resp => {
        if (resp.ok){
            mostrarToast("Dados atualizados ✓");
            fecharModal();
            carregarDados(false);
        } else {
            mostrarToast("Erro: " + (resp.error || "não foi possível salvar"));
        }
    })
    .catch(err => {
        console.error(err);
        mostrarToast("Falha de conexão — não salvou, tente de novo");
    });
}

function excluirItemRemoto(aba, row){
    mostrarToast("Excluindo...");
    fetch(URL_API, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ acao: "excluirItem", aba, row: Number(row) })
    })
    .then(r => r.json())
    .then(resp => {
        if (resp.ok){
            mostrarToast("Excluído ✓");
            fecharModal();
            carregarDados(false);
        } else {
            mostrarToast("Erro: " + (resp.error || "não foi possível excluir"));
        }
    })
    .catch(err => {
        console.error(err);
        mostrarToast("Falha de conexão — não excluiu, tente de novo");
    });
}

function fecharModal(){
    document.getElementById("overlay").classList.remove("aberto");
}

// ---------- ENVIAR ATUALIZAÇÃO ----------
// Atualização OTIMISTA: a tela muda na hora (fecha modal, recolore o item),
// sem esperar o Apps Script responder — que pode levar alguns segundos.
// A gravação acontece por trás; se falhar, desfaz e avisa.
function enviarAtualizacao(aba, linhas, novoStatus, itemLocal, aoTerminar){
    const statusAnterior = itemLocal ? itemLocal.Status : null;

    // aplica na hora, na interface
    if (itemLocal) itemLocal.Status = novoStatus;
    if (aoTerminar) aoTerminar(); else fecharModal();
    if (itemLocal) atualizarItemVisual(itemLocal); else renderizarLista();
    mostrarToast("Salvando...");

    fetch(URL_API, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, // evita preflight CORS
        body: JSON.stringify({ aba, rows: linhas, status: novoStatus })
    })
    .then(r => r.json())
    .then(resp => {
        if (resp.ok){
            mostrarToast("Status atualizado ✓");
        } else {
            if (itemLocal) itemLocal.Status = statusAnterior;
            if (itemLocal) atualizarItemVisual(itemLocal); else renderizarLista();
            mostrarToast("Erro: " + (resp.error || "não foi possível salvar"));
        }
    })
    .catch(err => {
        console.error(err);
        if (itemLocal) itemLocal.Status = statusAnterior;
        if (itemLocal) atualizarItemVisual(itemLocal); else renderizarLista();
        mostrarToast("Falha de conexão — não salvou, tente de novo");
    });
}

// ---------- INÍCIO ----------
function iniciar(){
    montarAbas();
    carregarDados(true);
    setInterval(() => carregarDados(false), 20000);
}

if (document.body.classList.contains("logado")) iniciar();
</script>
